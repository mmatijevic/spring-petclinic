<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <h2 class="mb-3" th:text="#{signIn}">Sign In</h2>

      <div th:if="${param.error}" class="alert alert-danger" role="alert"
        th:text="#{login.error}">Invalid username or password.</div>
      <div th:if="${param.logout}" class="alert alert-success" role="alert"
        th:text="#{login.logout}">You have been logged out.</div>

      <form method="post" th:action="@{/login}" class="card card-body shadow-sm">
        <div class="mb-3">
          <label class="form-label" for="username" th:text="#{username}">Username</label>
          <input class="form-control" id="username" name="username" type="text" autocomplete="username" autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password" th:text="#{password}">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password">
        </div>
        <th:block th:if="${#ctx.containsVariable('_csrf')}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        </th:block>
        <div class="d-grid">
          <button class="btn btn-primary" type="submit" th:text="#{signIn}">Sign In</button>
        </div>
      </form>
    </div>
  </div>

</body>

</html>
