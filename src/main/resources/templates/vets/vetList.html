<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <h2 th:text="#{vets}">Veterinarians</h2>

  <form th:action="@{/vets.html}" method="get" class="form-horizontal">
    <div class="form-group row mb-3">
      <div class="col-md-4">
        <label for="name" th:text="#{searchByName}">Search by Name:</label>
        <input type="text" id="name" name="name" class="form-control" th:value="${name}"
          placeholder="First or Last Name" />
      </div>
      <div class="col-md-4">
        <label for="specialty" th:text="#{searchBySpecialty}">Search by Specialty:</label>
        <input type="text" id="specialty" name="specialty" class="form-control" th:value="${specialty}"
          placeholder="e.g., surgery, radiology" />
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button type="submit" class="btn btn-primary me-2" th:text="#{search}">Search</button>
        <a th:href="@{/vets.html}" class="btn btn-secondary" th:text="#{clear}">Clear</a>
      </div>
    </div>
  </form>

  <table id="vets" class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{specialties}">Specialties</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="vet : ${listVets}">
        <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
        <td>
          <span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}" /> <span
            th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">none</span>
        </td>
      </tr>
    </tbody>
  </table>
  <div th:if="${totalPages > 1}">
    <span th:text="#{pages}">Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}"
        th:href="@{/vets.html(page=${i}, name=${name}, specialty=${specialty})}">[[${i}]]</a>
      <span th:unless="${currentPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{/vets.html(page=1, name=${name}, specialty=${specialty})}"
        th:title="#{first}" class="fa fa-fast-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{first}" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage > 1}"
        th:href="@{/vets.html(page=${currentPage - 1}, name=${name}, specialty=${specialty})}" th:title="#{previous}"
        class="fa fa-step-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{previous}" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}"
        th:href="@{/vets.html(page=${currentPage + 1}, name=${name}, specialty=${specialty})}" th:title="#{next}"
        class="fa fa-step-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{next}" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}"
        th:href="@{/vets.html(page=${totalPages}, name=${name}, specialty=${specialty})}" th:title="#{last}"
        class="fa fa-fast-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{last}" class="fa fa-fast-forward"></span>
    </span>
  </div>
</body>

</html>
